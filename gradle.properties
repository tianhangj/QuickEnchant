# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Use local JDK 25 (fabric-loom 1.17 requires a Java 21+ JVM, MC 26.1.2 requires Java 25)
org.gradle.java.home=D:/games/Minecraft/java/jdk-25.0.4.1+1

# IntelliJ IDEA is not yet fully compatible with configuration cache, see:
# https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# 多版本构建需要从 maven.fabricmc.net 拉取多套依赖，默认超时太短会频繁 Read timed out
systemProp.org.gradle.internal.http.socketTimeout=600000
systemProp.org.gradle.internal.http.connectionTimeout=600000

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.1.2
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod Properties
version=1.3.1
group=me.tianhangj.quickenchant

# Dependencies
# 注意: 这些是「不带 -Pmc_ver 时的基线默认值」，与 versions.properties 的 26.1.2 段落保持一致。
# malilib 0.28.8 在 26.1.2 上并不存在（Maven 404），实际可用的最早构建是 0.28.9。
fabric_api_version=0.155.3+26.1.2
malilib_version=0.28.12
malilib_min_version=0.28.9
quickshulker_version=3.0.1-26.1
seedfinding_seed_version=1.171.2
latticg_version=1.07
junit_version=5.13.4
