# =============================================================================
# QuickEnchant 版本矩阵
#
# 每个受支持的 Minecraft 版本一段。键名 = "<mc版本>.<依赖名>"。
# 构建时用 `-Pmc_ver=<版本>` 选择，未指定的项回落到 gradle.properties 里的默认值。
#
# 用途:
#   ./gradlew build -Pmc_ver=26.1.2
#   ./gradlew build -Pmc_ver=26.2
#   ./gradlew build -Pmc_ver=26.3
#
# 注意: 每个产物只保证在它对应的 MC 版本上可用 —— mixin 注入目标是编译期定死的,
#       不能跨版本复用同一个 jar。
#
# malilib 与 malilib_min 的区别（很重要）:
#   malilib     = 编译时使用的版本，取该 MC 版本下最新的稳定构建
#   malilib_min = 写进 fabric.mod.json 的运行时下限，取该 MC 版本下我们实测过的最旧构建
# 这样「用新 API 编译」与「兼容旧运行时」解耦，用户不会因为下限写得过高而被挡住。
# 新增版本时请务必实测 malilib_min 那一个版本能否编译通过。
# =============================================================================

# --- 26.1.2 (当前基线) ---
# 26.1.2 没有 0.28.8，实际可用的最早构建是 0.28.9
26.1.2.minecraft=26.1.2
26.1.2.fabric_api=0.155.3+26.1.2
26.1.2.malilib=0.28.12
26.1.2.malilib_min=0.28.9
26.1.2.quickshulker=3.0.1-26.1

# --- 26.2 (破坏性分水岭) ---
26.2.minecraft=26.2
26.2.fabric_api=0.161.0+26.2
26.2.malilib=0.29.6
26.2.malilib_min=0.29.3
26.2.quickshulker=3.1.0-26.2

# --- 26.3 ---
26.3.minecraft=26.3
26.3.fabric_api=0.165.0+26.3
26.3.malilib=0.30.2
26.3.malilib_min=0.30.0
26.3.quickshulker=3.1.1-26.3
